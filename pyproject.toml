[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-probe"
version = "0.1.0"
description = "Transparent recording proxy for the LLM calls made by the Codex CLI, with a config-only backend swap."
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-m 'not e2e'"
markers = [
    "e2e: runs the real Codex CLI or a real model backend; excluded from the default run",
]
